<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="560" rx="16" fill="#0d1117"/>
  <text x="32" y="44" fill="#e6edf3" font-size="22" font-weight="600">Dell Universal Dock D6000: what sits behind the one USB-C cable</text>
  <text x="32" y="68" fill="#8b949e" font-size="14">As seen from macOS (Apple Silicon). Green = updated by d6000-fw.py, grey = not touched.</text>

  <!-- Mac -->
  <rect x="32" y="230" width="120" height="90" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="92" y="270" fill="#e6edf3" font-size="16" font-weight="600" text-anchor="middle">Mac</text>
  <text x="92" y="292" fill="#8b949e" font-size="12" text-anchor="middle">USB-C port</text>
  <line x1="152" y1="275" x2="210" y2="275" stroke="#8b949e" stroke-width="3"/>

  <!-- dock outline -->
  <rect x="210" y="96" width="718" height="440" rx="14" fill="none" stroke="#30363d" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="226" y="120" fill="#8b949e" font-size="13">D6000 (one USB-C cable: USB 3 + USB 2.0 + power; monitors via DisplayLink)</text>

  <!-- USB-C split -->
  <rect x="226" y="236" width="110" height="78" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="281" y="266" fill="#e6edf3" font-size="13" text-anchor="middle">USB-C mux</text>
  <text x="281" y="284" fill="#8b949e" font-size="11" text-anchor="middle">VIA billboard</text>
  <text x="281" y="300" fill="#8b949e" font-size="11" text-anchor="middle">2109:0103</text>

  <!-- TI PD -->
  <rect x="226" y="400" width="190" height="70" rx="8" fill="#0f2a1a" stroke="#2ea043"/>
  <text x="321" y="428" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">TI USB-PD controller</text>
  <text x="321" y="448" fill="#7ee787" font-size="12" text-anchor="middle">01020105 → 01020202</text>
  <text x="321" y="463" fill="#8b949e" font-size="11" text-anchor="middle">charging the Mac</text>
  <line x1="281" y1="314" x2="300" y2="400" stroke="#8b949e" stroke-width="2"/>

  <!-- Parade -->
  <rect x="380" y="140" width="190" height="70" rx="8" fill="#0f2a1a" stroke="#2ea043"/>
  <text x="475" y="168" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">Parade converter</text>
  <text x="475" y="188" fill="#7ee787" font-size="12" text-anchor="middle">0B5D → 0B81</text>
  <text x="475" y="203" fill="#8b949e" font-size="11" text-anchor="middle">DisplayPort → HDMI converter</text>
  <line x1="336" y1="250" x2="380" y2="180" stroke="#8b949e" stroke-width="2"/>
  <line x1="570" y1="175" x2="910" y2="175" stroke="#8b949e" stroke-width="2"/>
  <text x="900" y="166" fill="#e6edf3" font-size="13" text-anchor="end">HDMI port</text>

  <!-- GL hubs -->
  <rect x="380" y="236" width="190" height="78" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="475" y="262" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">Genesys hubs</text>
  <text x="475" y="282" fill="#8b949e" font-size="11" text-anchor="middle">GL3523 + GL3590</text>
  <text x="475" y="298" fill="#8b949e" font-size="11" text-anchor="middle">05e3:0610 / 0620 · fw current</text>
  <line x1="336" y1="275" x2="380" y2="275" stroke="#8b949e" stroke-width="3"/>
  <line x1="570" y1="262" x2="910" y2="262" stroke="#8b949e" stroke-width="2"/>
  <text x="900" y="253" fill="#e6edf3" font-size="13" text-anchor="end">USB-A / USB-C ports</text>

  <!-- DisplayLink -->
  <rect x="620" y="300" width="190" height="78" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="715" y="326" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">DisplayLink chip</text>
  <text x="715" y="344" fill="#8b949e" font-size="11" text-anchor="middle">17e9:6006 · Ethernet + audio</text>
  <text x="715" y="360" fill="#8b949e" font-size="11" text-anchor="middle">+ video for the dock's monitor ports</text>
  <line x1="570" y1="290" x2="620" y2="330" stroke="#8b949e" stroke-width="2"/>

  <!-- controller -->
  <rect x="460" y="400" width="300" height="110" rx="8" fill="#0f2a1a" stroke="#2ea043"/>
  <text x="610" y="426" fill="#e6edf3" font-size="14" font-weight="600" text-anchor="middle">Dock controller (STM32, BizLink fw)</text>
  <text x="610" y="446" fill="#7ee787" font-size="12" text-anchor="middle">0017 → 0020</text>
  <text x="610" y="466" fill="#8b949e" font-size="11" text-anchor="middle">06c4: c411 normal · 6001 app-DFU · c302 bootloader</text>
  <text x="610" y="484" fill="#8b949e" font-size="11" text-anchor="middle">reports TI (string 6) and Parade (string 7) versions</text>
  <text x="610" y="500" fill="#8b949e" font-size="11" text-anchor="middle">flashes TI (alt 1) and Parade (alt 2) for us</text>
  <line x1="520" y1="314" x2="560" y2="400" stroke="#8b949e" stroke-width="2"/>
</svg>
